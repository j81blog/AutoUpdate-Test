name: Update Version Info Gist

on:
  release:
    types: [published]

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Determine Version and Channel
        id: vars
        shell: pwsh
        run: |
          $tagName = "${{ github.event.release.tag_name }}"
          $version = $tagName -replace '^v'
          $isPreRelease = ${{ github.event.release.prerelease }}
          $channel = if ($isPreRelease) { 'dev' } else { 'stable' }

          echo "tag_name=$tagName" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "channel=$channel" >> $env:GITHUB_OUTPUT
          Write-Host "Release: $tagName, Version: $version, Channel: $channel"

      - name: Update Gist Content
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GIST_PAT }}
          GIST_ID: "27a5c52571bddc7eff4ea21f407d4e71"
          GIST_USER: "j81blog" # Your GitHub username
        run: |
          # The raw URL for the Gist
          $gistRawUrl = "https://gist.githubusercontent.com/$($env:GIST_USER)/$($env:GIST_ID)/raw/"

          try {
              # Download AND parse the JSON in one single, direct step into a PS object.
              Write-Host "Fetching and parsing JSON from $gistRawUrl"
              $json = Invoke-RestMethod -Uri $gistRawUrl -ErrorAction Stop
              Write-Host "Successfully parsed Gist content into a PowerShell object."
          } catch {
              Write-Error "Failed to fetch or parse Gist content. Error: $($_.Exception.Message)"
              exit 1
          }

          # Update the PowerShell object directly in memory
          $json.channels.${{ steps.vars.outputs.channel }}.version = "${{ steps.vars.outputs.version }}"

          # Convert the modified object back to a JSON string
          $newJsonString = $json | ConvertTo-Json -Depth 10

          # Save the new string to a temporary file for the upload step
          $newJsonString | Set-Content -Path ./versioninfo.json

          # The 'gh gist edit' command uploads the modified file.
          gh gist edit $env:GIST_ID ./versioninfo.json
          Write-Host "Successfully uploaded new content to Gist."