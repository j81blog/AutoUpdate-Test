name: Update Version Info Gist

on:
  release:
    types: [published]

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Determine Version and Channel
        id: vars
        shell: pwsh
        run: |
          $tagName = "${{ github.event.release.tag_name }}"
          $version = $tagName -replace '^v'
          $isPreRelease = ${{ github.event.release.prerelease }}
          $channel = if ($isPreRelease) { 'dev' } else { 'stable' }

          echo "tag_name=$tagName" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "channel=$channel" >> $env:GITHUB_OUTPUT
          Write-Host "Release: $tagName, Version: $version, Channel: $channel"

      - name: Update Gist Content
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GIST_PAT }}
          GIST_ID: "27a5c52571bddc7eff4ea21f407d4e71"
        run: |
          # Download the current raw content of the Gist
          gh gist view $env:GIST_ID --raw > versioninfo.json

          try {
              # Attempt to parse the downloaded content. If it fails, the script will stop.
              if (-not (Test-Path -Path ./versioninfo.json)) {
                  Write-Error "Downloaded Gist content is empty or not found. Please check the Gist ID."
                  exit 1
              }
              $content = Get-Content -Path ./versioninfo.json -Raw
              write-Host "Downloaded Gist content successfully."
              $Content = | Out-String
              $content | ConvertFrom-Json -ErrorAction Stop
              Write-Host "Gist content is valid JSON. Proceeding..."
          } catch {
              Write-Error "Downloaded Gist content is NOT valid JSON. Please check the Gist content manually at https://gist.github.com/j81blog/$($env:GIST_ID)"
              Write-Error "Error details: $($_.Exception.Message)"
              # Exit with a non-zero code to fail the entire workflow
              exit 1
          }

          # Read and update the JSON with the variables from the previous step
          $json = Get-Content -Path ./versioninfo.json -Raw | ConvertFrom-Json
          $json.channels.${{ steps.vars.outputs.channel }}.version = "${{ steps.vars.outputs.version }}"
          $newJsonString = $json | ConvertTo-Json -Depth 10
          $newJsonString | Set-Content -Path ./versioninfo.json

          # Upload the modified file to update the Gist
          gh gist edit $env:GIST_ID ./versioninfo.json
          Write-Host "Successfully uploaded new content to Gist."