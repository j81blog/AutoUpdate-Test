name: Update Version Info Gist

on:
  release:
    types: [published]

jobs:
  update-gist:
    runs-on: windows-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install J81.PSScriptTools Module
        shell: pwsh
        run: |
          #Install-Module -Name J81.PSScriptTools -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop
          iex (irm https://raw.githubusercontent.com/j81blog/J81.PSScriptTools/refs/heads/dev/Install-ModuleFromGithubDev.ps1)

      - name: Determine Version and Channel
        id: vars
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            GH_REPOSITORY: ${{ github.repository }}
            GH_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          Import-Module -Name J81.PSScriptTools -Force
          Get-VersionAndChannel

      - name: Update Gist Content
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          GIST_PAT_TOKEN: ${{ secrets.GIST_PAT }}
          GH_REPOSITORY: ${{ github.repository }}
          GIST_ID: ${{ vars.GIST_ID }}
          GIST_FILE: ${{ vars.GIST_FILE }}
          VERSION: ${{ steps.vars.outputs.version }}
          CHANNEL: ${{ steps.vars.outputs.channel }}

        run: |
          Import-Module -Name J81.PSScriptTools -Force
          Set-GistContent

      - name: Test Gist Update
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GIST_ID: ${{ vars.GIST_ID }}
          GIST_FILE: ${{ vars.GIST_FILE }}
          VERSION: ${{ steps.vars.outputs.version }}
          CHANNEL: ${{ steps.vars.outputs.channel }}
        run: |
          Import-Module -Name J81.PSScriptTools -Force
          Test-GistUpdate
