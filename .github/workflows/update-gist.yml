name: Update Version Info Gist

on:
  release:
    types: [published]

jobs:
  update-gist:
    runs-on: windows-latest
    steps:
      - name: Install J81.PSScriptTools Module
        shell: pwsh
        run: |
          #Install-Module -Name J81.PSScriptTools -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop
          iex (irm https://raw.githubusercontent.com/j81blog/J81.PSScriptTools/refs/heads/dev/Install-ModuleFromGithubDev.ps1)

      - name: Determine Version and Channel
        id: vars
        shell: pwsh
        run: |
          $owner, $repository = "${{ github.repository }}" -split '/'
          $tagName = "${{ github.event.release.tag_name }}"
          $version = $tagName -replace '^v'

          Write-Host "Tag Name: $tagName"
          Write-Host "Version: $version"

          $ReleaseUrl = "https://api.github.com/repos/$($owner)/$($repository)/releases/tags/$($tagName)"
          $Headers = @{
              "Accept" = "application/vnd.github+json"
              "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}"
              "X-GitHub-Api-Version" = "2022-11-28"
          }
          try {
              $ReleaseData = Invoke-RestMethod -Uri $ReleaseUrl -Headers $Headers
              $IsPrerelease = $ReleaseData.prerelease
              Write-Host "Release: '$tagName'; Pre-release: $IsPrerelease"
              if ($IsPrerelease) {
                  $channel = 'dev'
              } else {
                  $channel = 'stable'
              }
              Write-Host "Determined channel: $channel"
          } catch {
              Write-Error "Failed to retrieve release information for '$tagName'. Error: $($_.Exception.Message)"
              exit 1
          }
          Write-HOst "Storing channel and version in outputs."
          if (-Not [string]::IsNullOrEmpty($channel)) {
              Write-Host "Channel determined: $channel"
              echo "channel=$channel" >> $env:GITHUB_OUTPUT
          } else {
              Write-Error "Failed to determine channel for release '$tagName'."
              exit 1
          }
          if (-Not [string]::IsNullOrEmpty($version)) {
              Write-Host "Version determined: $version"
              echo "version=$version" >> $env:GITHUB_OUTPUT
          } else {
              Write-Error "Failed to determine version for release '$tagName'."
              exit 1
          }

      - name: Update Gist Content
        shell: pwsh
        env:
          PAT_TOKEN: ${{ secrets.GIST_PAT }}
        run: |
          Import-Module -Name J81.PSScriptTools -Force -ErrorAction Stop
          $owner, $repository = "${{ github.repository }}" -split '/'
          $gistId = "${{ vars.GIST_ID }}"
          $gistFileName = "${{ vars.GIST_FILE }}"
          $gistRawUrl = "https://gist.githubusercontent.com/$($owner)/$($gistId)/raw/"
          $VerbosePreference = 'Continue'
          try {
              Write-Host "Fetching and parsing JSON from $($gistRawUrl)"
              $json = Invoke-RestMethod -Uri $gistRawUrl -ErrorAction Stop
              Write-Host "Successfully parsed Gist content."
          } catch {
              Write-Error "Failed to fetch or parse Gist content. Error: $($_.Exception.Message)"
              exit 1
          }

          # Get the new version info from the previous step
          $newVersion = "${{ steps.vars.outputs.version }}"
          $channel = "${{ steps.vars.outputs.channel }}"
          Write-Host "New Version: $($newVersion), Channel: $($channel)"

          Write-Verbose "Retrieving release notes for version $($newVersion) in channel $($channel) in repository $($owner)/$($repository)."
          # Retrieve the release notes by name
          $params = @{
              PersonalAccessToken = $env:PAT_TOKEN
              GithubOwner = $owner
              GithubRepo = $repository
              CommitName = "v$newVersion"
              Github = $true
          }
          $releaseNotes = Get-GitHubCommitDescriptionByName @params -ErrorAction Stop
          Write-Verbose "Release notes retrieved: $($releaseNotes)"

          # If a changelog entry for this new version doesn't exist, create one.
          if (-not $json.changelog.$newVersion) {
              Write-Host "No changelog entry found for version $($newVersion). Creating a new one."

              # Find the previous version to copy dependencies from.
              $newEntry = $json.changelog._newversion
              if (-Not [String]::IsNullOrEmpty($newEntry) -and ($newEntry | gm -Type NoteProperty).Count -gt 0) {
                  Write-Host "Used the template from the _newversion entry."
              } else {
                  Write-Host "No template found for _newversion. Creating a new entry."
                  $newEntry = @{
                      CertificateSubject = ""
                      dependencies = @{
                          minPSVersion = "5.1"
                          modules = @()
                      }
                      notes        = @()
                  }
              }
              $json.changelog | Add-Member -MemberType NoteProperty -Name $newVersion -Value $newEntry
              $json.lastupdated = (Get-Date).ToString("yyyy-MM-ddTHH:mm:ssZ")
          } else {
              Write-Host "Changelog entry for version $($newVersion) already exists."
          }

          # Update the 'notes' with the body from the GitHub release.
          # We split the string by newlines and filter out any empty lines.
          $notesArray = $releaseNotes -split [System.Environment]::NewLine | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          $json.changelog.$newVersion.notes = $notesArray
          Write-Host "Updated changelog notes for version $($newVersion)."

          Write-Host "=========================================================="
          Write-Host "New Release Notes:"
          foreach ($note in $json.changelog.$newVersion.notes) {
              Write-Host "- $($note)"
          }
          Write-Host "=========================================================="
          # Update the version number in the correct channel.
          $json.channels.$channel.version = $newVersion
          Write-Host "Updated $($channel) channel to version $($newVersion)."

          # Convert the full, updated object back to JSON.
          $newJsonString = $json | ConvertTo-Json -Depth 10

          # Prepare the request body for updating the Gist
          $body = @{
              description = "AutoUpdate Version Info - $($newVersion)"
              files = @{
                  "$($gistFileName)" = @{
                      content = $newJsonString
                  }
              }
          }
          # Prepare the headers for the API request
          $headers = @{
              Authorization = "Bearer $($env:PAT_TOKEN)"
              Accept = "application/vnd.github+json"
          }
          $gistUpdateUrl = "https://api.github.com/gists/$($gistId)"
          Write-Host "Updating Gist at $($gistUpdateUrl) with new content."
          $response = Invoke-RestMethod -Uri $gistUpdateUrl -Method Patch -Headers $headers -Body ($body | ConvertTo-Json -Depth 6) -ErrorAction Stop
          Write-Host "Gist updated successfully. Response: $($response | ConvertTo-Json -Depth 6)"

      - name: Test Gist Update
        shell: pwsh
        env:
          PAT_TOKEN: ${{ secrets.GIST_PAT }}
        run: |
          $owner, $repository = "${{ github.repository }}" -split '/'
          $gistId = "${{ vars.GIST_ID }}"
          $gistFileName = "${{ vars.GIST_FILE }}"
          $version = "${{ steps.vars.outputs.version }}"
          $channel = "${{ steps.vars.outputs.channel }}"
          $gistRawUrl = "https://gist.githubusercontent.com/$($owner)/$($gistId)/raw/$($gistFileName)"
          Write-Host "Testing Gist update at $($gistRawUrl) for version $($version) in channel $($channel) to check if the version is set and contains release notes."
          try {
              $json = Invoke-RestMethod -Uri $gistRawUrl -ErrorAction Stop
              Write-Host "Successfully fetched Gist content for testing."
              if ($json.channels.$channel.version -eq $version) {
                  Write-Host "Version in Gist matches the expected version: $($version)."
              } else {
                  Write-Error "Version mismatch! Expected: $($version), Found: $($json.channels.$channel.version)"
                  exit 1
              }
              if ($json.changelog.$version -and $json.changelog.$version.notes.Count -gt 0) {
                  Write-Host "Release notes for version $($version) are present in the Gist."
              } else {
                  Write-Error "Release notes for version $($version) are missing in the Gist."
                  exit 1
              }
          } catch {
              Write-Error "Failed to fetch Gist content for testing. Error: $($_.Exception.Message)"
              exit 1
          }
