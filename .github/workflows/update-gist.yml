name: Update Version Info Gist

on:
  release:
    types: [published]

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Determine Version and Channel
        id: vars
        shell: pwsh
        run: |
          $VerbosePreference = 'Continue'
          $tagName = "${{ github.event.release.tag_name }}"
          Write-Verbose "Release tag name: $tagName"
          $version = $tagName -replace '^v'
          $isPreRelease = ${{ github.event.release.prerelease }}
          Write-Verbose "PreRelease: $isPreRelease"
          $channel = if ($isPreRelease) { 'dev' } else { 'stable' }
          Write-Verbose "Determined channel: $channel"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "channel=$channel" >> $env:GITHUB_OUTPUT
          Write-Host "Processing Release: $tagName, Version: $version, Channel: $channel"

      - name: Update Gist Content
        shell: pwsh
        env:
          PAT_TOKEN: ${{ secrets.GIST_PAT }}
          GIST_ID: "27a5c52571bddc7eff4ea21f407d4e71"
          GIST_USER: "j81blog"
          GIST_FILE: "versioninfo.json"
        run: |
          $gistRawUrl = "https://gist.githubusercontent.com/$($env:GIST_USER)/$($env:GIST_ID)/raw/"
          $VerbosePreference = 'Continue'
          $owner, $repository = $env:GITHUB_REPOSITORY -split '/'
          try {
              Write-Host "Fetching and parsing JSON from $($gistRawUrl)"
              $json = Invoke-RestMethod -Uri $gistRawUrl -ErrorAction Stop
              Write-Host "Successfully parsed Gist content."
          } catch {
              Write-Error "Failed to fetch or parse Gist content. Error: $($_.Exception.Message)"
              exit 1
          }

          # Get the new version info from the previous step
          $newVersion = "${{ steps.vars.outputs.version }}"
          $channel = "${{ steps.vars.outputs.channel }}"
          Write-Host "New Version: $($newVersion), Channel: $($channel)"

          function Get-GitHubCommitDescriptionByName {
              <#
              .SYNOPSIS
                  Retrieves the full commit message/description for a given commit.
              .DESCRIPTION
                  This function fetches the commit details from the GitHub API
                  for a specified owner, repository, and commit (SHA, branch, or tag name).
                  It then extracts and returns the full commit message body, which often
                  serves as release notes.
              .PARAMETER PersonalAccessToken
                  The GitHub Personal Access Token (PAT) used for authentication.
                  It needs to have 'repo' scope (for private repos) or 'public_repo' for public.
              .PARAMETER Owner
                  The owner of the GitHub repository (user or organization name).
              .PARAMETER Repository
                  The name of the GitHub repository.
              .PARAMETER CommitName
                  The name of the commit to retrieve the description for.
                  This can be a commit SHA, a branch name, or a tag name.
              .NOTES
                  Version       : 1.0
                  Author        : John Billekens
                  LastUpdated   : 2025-07-05
                  Compatibility : PowerShell 5.1+
              #>
              [CmdletBinding()]
              param (
                  [Parameter(Mandatory = $true)]
                  [Alias('PAT')]
                  [string]$PersonalAccessToken,

                  [Parameter(Mandatory = $true)]
                  [string]$Owner,

                  [Parameter(Mandatory = $true)]
                  [string]$Repository,

                  [Parameter(Mandatory = $true)]
                  [string]$CommitName
              )
              try {
                  $headers = @{
                      "Accept"               = "application/vnd.github+json"
                      "Authorization"        = "Bearer $($PersonalAccessToken)"
                      "X-GitHub-Api-Version" = "2022-11-28"
                  }

                  $commitApiUrl = "https://api.github.com/repos/$($Owner)/$($Repository)/commits/$($CommitName)"
                  Write-Verbose "Fetching commit details from GitHub API: $($commitApiUrl)"
                  $commitResponse = Invoke-RestMethod -Uri $commitApiUrl -Headers $headers -Method Get -ErrorAction Stop

                  $fullCommitMessage = "$($commitResponse.commit.message)".Trim()
                  Write-Verbose "Full commit message for '$($CommitName)': $($fullCommitMessage)"
                  if ($null -ne $fullCommitMessage) {
                      Write-Verbose "Extracting commit description for '$($CommitName)'."
                      # The body of the commit message is everything after the first line (subject)
                      $messageLines = $fullCommitMessage.Split([Environment]::NewLine, [StringSplitOptions]::RemoveEmptyEntries)
                      if ($messageLines.Count -gt 1) {
                          Write-Verbose "Commit message has multiple lines. Extracting body."
                          # Skip the first line (subject) and join the remaining lines to get the description/body
                          return ($messageLines | Select-Object -Skip 1) -join [Environment]::NewLine
                      } else {
                          Write-Verbose "Commit message has only one line. Returning as description."
                          # If there's only one line, return it as the description
                          return $messageLines[0]
                      }
                  } else {
                      Write-Warning "No commit message found for '$($CommitName)'."
                      return $null
                  }
              } catch {
                  Write-Error "An error occurred while fetching commit details from GitHub API: $($_.Exception.Message)"
                  return $null
              }
          }

          Write-Verbose "Retrieving release notes for version $($newVersion) in channel $($channel) in repository $($owner)/$($repository)."
          # Retrieve the release notes by name
          $releaseNotes = Get-GitHubCommitDescriptionByName `
              -PersonalAccessToken $($env:PAT_TOKEN) `
              -Owner $owner `
              -Repository $repository `
              -CommitName "v$($newVersion)" `
              -Verbose
          Write-Verbose "Release notes retrieved: $($releaseNotes)"

          # If a changelog entry for this new version doesn't exist, create one.
          if (-not $json.changelog.$newVersion) {
              Write-Host "No changelog entry found for version $($newVersion). Creating a new one."

              # Find the previous version to copy dependencies from.
              $previousVersion = $json.channels.$channel.version
              $newEntry = @{
                  dependencies = @{
                      minPSVersion = "5.1"
                      modules = @()
                  }
                  notes        = @()
              }

              # Copy dependencies from the previous version if it exists.
              if ($json.changelog.$previousVersion) {
                  $newEntry.dependencies = $json.changelog.$previousVersion.dependencies
                  Write-Host "Copied dependencies from previous version $($previousVersion)."
              }

              $json.changelog | Add-Member -MemberType NoteProperty -Name $newVersion -Value $newEntry
          }

          # Update the 'notes' with the body from the GitHub release.
          # We split the string by newlines and filter out any empty lines.
          $notesArray = $releaseNotes -split [System.Environment]::NewLine | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          $json.changelog.$newVersion.notes = $notesArray
          Write-Host "Updated changelog notes for version $($newVersion)."

          Write-Host "=========================================================="
          Write-Host "New Release Notes:"
          foreach ($note in $json.changelog.$newVersion.notes) {
              Write-Host "- $($note)"
          }
          Write-Host "=========================================================="
          # Update the version number in the correct channel.
          $json.channels.$channel.version = $newVersion
          Write-Host "Updated $($channel) channel to version $($newVersion)."

          # Convert the full, updated object back to JSON.
          $newJsonString = $json | ConvertTo-Json -Depth 10

          # Prepare the request body for updating the Gist
          $body = @{
              description = "AutoUpdate Version Info - $($newVersion)"
              files = @{
                  "$($env:GIST_FILE)" = @{
                      content = $newJsonString
                  }
              }
          }
          # Prepare the headers for the API request
          $headers = @{
              Authorization = "Bearer $($env:PAT_TOKEN)"
              Accept = "application/vnd.github+json"
          }
          $gistUpdateUrl = "https://api.github.com/gists/$($env:GIST_ID)"
          Write-Host "Updating Gist at $($gistUpdateUrl) with new content."
          $response = Invoke-RestMethod -Uri $gistUpdateUrl -Method Patch -Headers $headers -Body ($body | ConvertTo-Json -Depth 6) -ErrorAction Stop
          Write-Host "Gist updated successfully. Response: $($response | ConvertTo-Json -Depth 6)"