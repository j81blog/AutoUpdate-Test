name: Create Release From Commit

on:
  push:
    branches:
      - main
      - dev

jobs:
  create-release:
    # Only run this job if the commit message contains a version string (e.g., v1.2.3)
    if: contains(github.event.head_commit.message, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch all history so we can generate release notes from git log
          fetch-depth: 0
          token: ${{ secrets.GIST_PAT }}

      - name: Prepare and Publish Release
        env:
          # The GITHUB_TOKEN is automatically provided and is needed for gh
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # Find the GitHub CLI (gh) executable
          $ghCliPath = Get-Command -Name 'gh' -ErrorAction SilentlyContinue
          if (-not $ghCliPath) {
              Write-Verbose -Message "Could not find 'gh' in PATH. Checking default installation directory..."
              # On Linux runners, the default location is different
              $fallbackPath = "/usr/bin/gh"
              if (Test-Path -Path $fallbackPath) {
                  $ghCliPath = $fallbackPath
                  Write-Verbose -Message "Found gh at: $($ghCliPath)"
              } else {
                  Write-Error -Message "GitHub CLI ('gh') could not be found. This is unexpected on a GitHub-hosted runner."
                  exit 1
              }
          } else {
              # Get the full path from the CommandInfo object
              $ghCliPath = $ghCliPath.Source
          }

          # Extract the version from the commit message
          $commitMessage = "${{ github.event.head_commit.message }}"
          $regex = "v(\d+\.\d+\.\d+)"
          $match = [regex]::Match($commitMessage, $regex)

          if (-not $match.Success) {
            Write-Host "No version tag found in commit message. Skipping release."
            exit 0
          }

          $versionNumber = $match.Groups[1].Value
          $tagName = "v$($versionNumber)"
          Write-Host "Found version: $tagName"

          # Read the release configuration from the JSON file
          $configFilePath = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath ".github/workflows/release.config.json"
          if (-not (Test-Path -Path $configFilePath)) {
            Write-Error "Release config file not found at: $($configFilePath)"
            exit 1
          }
          $config = Get-Content -Path $configFilePath -Raw | ConvertFrom-Json
          $assetFiles = $config.assetFiles

          # Generate release notes from Git history
          try {
            # Find the most recent tag in the history
            $lastTag = git describe --tags --abbrev=0
            Write-Verbose "Generating notes for commits since tag '$($lastTag)'."
            # Get all commit subjects since the last tag as a bulleted list
            $releaseNotes = git log "$($lastTag)..HEAD" --pretty=format:"- %s"
            if ([string]::IsNullOrWhiteSpace($releaseNotes)) {
                $releaseNotes = "No new commits found since last tag. Re-releasing version $($versionNumber)."
            }
          } catch {
            Write-Warning "Could not generate release notes from Git history. Using generic notes."
            $releaseNotes = "Official release for version $($versionNumber)."
          }

          # Build the gh command and execute
          $branch = "${{ github.ref_name }}"
          $title = "Version $versionNumber"

          # Build the argument list for the gh command
          $argumentList = @( "release", "create", $tagName, "--title", "'$($title)'", "--notes", "'$($releaseNotes)'" )

          if ($branch -eq 'dev') {
            $argumentList += "--prerelease"
            Write-Host "Detected 'dev' branch. Creating a pre-release."
          }

          # Add all asset files from the config
          $argumentList += $assetFiles

          Write-Host "Executing gh release create..."
          Write-Verbose "Arguments: $($argumentList -join ' ')"

          # Execute the full command using the found path and the call operator '&'
          & $ghCliPath @argumentList

          if ($LASTEXITCODE -ne 0) {
            throw "gh command returned a non-zero exit code: $LASTEXITCODE."
          }

          Write-Host "Successfully created release and uploaded asset(s)." -ForegroundColor Green