name: Create Release From Commit

on:
  push:
    branches:
      - main
      - dev

jobs:
  create-release:
    # Voer deze job alleen uit als de commit-boodschap een versie bevat (bv. v1.2.3)
    if: "contains(github.event.head_commit.message, 'v')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch all history so we can generate release notes from git log
          fetch-depth: 0
          token: ${{ secrets.GIST_PAT }}

      - name: Prepare and Publish Release
        env:
          # De GITHUB_TOKEN wordt automatisch geleverd en is nodig voor gh
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # --- Stap 1: Extraheer Versie ---
          $commitMessage = "${{ github.event.head_commit.message }}"
          $regex = "v(\d+\.\d+\.\d+)"
          $match = [regex]::Match($commitMessage, $regex)

          if (-not $match.Success) {
            Write-Host "No version tag found in commit message. Skipping release."
            exit 0
          }

          $versionNumber = $match.Groups[1].Value
          $tagName = "v$($versionNumber)"
          Write-Host "Found version: $tagName"

          # --- Stap 2: Lees Release Configuratie ---
          $configFilePath = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath ".github/workflows/release.config.json"
          if (-not (Test-Path -Path $configFilePath)) {
            Write-Error "Release config file not found at: $($configFilePath)"
            exit 1
          }
          $config = Get-Content -Path $configFilePath -Raw | ConvertFrom-Json
          $assetFiles = $config.assetFiles

          # --- Stap 3: Genereer Release Notes ---
          try {
            # Vind de meest recente tag in de geschiedenis
            $lastTag = git describe --tags --abbrev=0
            Write-Verbose "Generating notes for commits since tag '$($lastTag)'."
            # Haal alle commit-boodschappen op sinds de laatste tag als een bullet list
            $releaseNotes = git log "$($lastTag)..HEAD" --pretty=format:"- %s"
            if ([string]::IsNullOrWhiteSpace($releaseNotes)) {
                $releaseNotes = "No new commits found since last tag. Re-releasing version $($versionNumber)."
            }
          } catch {
            Write-Warning "Could not generate release notes from Git history. Using generic notes."
            $releaseNotes = "Official release for version $($versionNumber)."
          }

          # --- Stap 4: Bouw de 'gh' opdracht en voer uit ---
          $branch = "${{ github.ref_name }}"
          $title = "Version $versionNumber"

          # Bouw de argumentenlijst voor het gh commando
          $argumentList = @(
            "release",
            "create",
            $tagName,
            "--title",
            "'$($title)'",
            "--notes",
            "'$($releaseNotes)'"
          )

          if ($branch -eq 'dev') {
            $argumentList += "--prerelease"
            Write-Host "Detected 'dev' branch. Creating a pre-release."
          }

          # Voeg alle asset-bestanden uit de config toe
          $argumentList += $assetFiles

          Write-Host "Executing gh release create..."
          Write-Verbose "Arguments: $($argumentList -join ' ')"

          # Voer de volledige opdracht uit
          gh.exe @argumentList

          if ($LASTEXITCODE -ne 0) {
            throw "gh.exe returned a non-zero exit code: $LASTEXITCODE."
          }

          Write-Host "Successfully created release and uploaded asset(s)." -ForegroundColor Green